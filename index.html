<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>선우의 낚시 타자</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <section class="hero" aria-labelledby="title">
      <div>
        <p class="eyebrow">초2용 타자 연습 게임</p>
        <h1 id="title">선우의 낚시 타자</h1>
        <p class="subtitle">천천히 유영하는 물고기 이름을 따라 치면 낚싯줄이 슝— 5분 동안 몇 마리 잡나 해보자.</p>
      </div>
      <div class="mascot" aria-hidden="true">🎣🐟</div>
    </section>

    <section class="controls" aria-label="게임 설정">
      <button class="pill active" data-mode="ko">한글</button>
      <button class="pill" data-mode="en">영어</button>
      <button class="pill" data-speed="easy">느긋하게</button>
      <button class="pill active" data-speed="normal">보통</button>
      <button class="pill" data-speed="fast">바글바글</button>
    </section>

    <section class="scoreboard" aria-label="점수판">
      <div><span>남은 시간</span><strong id="time">5:00</strong></div>
      <div><span>잡은 물고기</span><strong id="score">0</strong></div>
      <div><span>어항 속</span><strong id="inWater">0</strong></div>
      <div><span>최고 기록</span><strong id="best">0</strong></div>
    </section>

    <section class="game-wrap">
      <div id="game" class="game" aria-live="polite">
        <div class="dock" aria-hidden="true">🧒🎣</div>
        <div id="line" class="line" aria-hidden="true"></div>
        <div id="fishes" class="fishes" aria-label="물고기들"></div>
        <div id="catch" class="catch" aria-hidden="true">🐟</div>
        <div id="pop" class="pop" aria-hidden="true"></div>
        <div id="finish" class="finish hidden" role="status" aria-live="polite"></div>
        <button id="start" class="start-overlay">시작</button>
      </div>
    </section>

    <section class="typing-panel">
      <label for="typing">여기에 물고기 이름 치기</label>
      <div class="input-row">
        <input id="typing" autocomplete="off" spellcheck="false" inputmode="text" />
      </div>
      <p id="message" class="message">시작을 누르면 5분 낚시가 시작된다.</p>
    </section>

    <section class="guide-panel" aria-label="2벌식 키보드 손가락 가이드">
      <div class="guide-head">
        <div>
          <strong>손가락 가이드</strong>
          <p>2벌식 QWERTY 기준. 다음 자모와 눌러야 할 손가락을 보여준다.</p>
        </div>
        <div id="nextHint" class="next-hint">다음: -</div>
      </div>
      <div id="jamoTrail" class="jamo-trail" aria-label="자모 입력 순서"></div>
      <div id="keyboard" class="keyboard" aria-label="한글 2벌식 키보드"></div>
      <div class="finger-legend" aria-label="손가락 번호 설명">
        <span>왼1 검지</span><span>왼2 중지</span><span>왼3 약지</span><span>왼4 새끼</span>
        <span>오1 검지</span><span>오2 중지</span><span>오3 약지</span><span>오4 새끼</span>
      </div>
    </section>

    <section class="parent-note">
      <strong>부모용 메모</strong>
      <p>점수는 잡은 마릿수다. 물고기는 평균 30초 정도 유영하다가 사라지고, 5분이 지나면 게임이 끝난다.</p>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
